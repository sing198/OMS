name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oms-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/oms_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: oms-backend/go.mod
          cache-dependency-path: oms-backend/go.sum
      - name: Vet
        run: go vet ./...
      - name: Unit and PostgreSQL integration tests
        run: go test -race -count=1 -v ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oms-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: oms-frontend/.nvmrc
          cache: npm
          cache-dependency-path: oms-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
